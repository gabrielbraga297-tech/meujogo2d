<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fase 1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="576"></canvas>

    <div id="menu" class="screen">
      <h1>Fase 1</h1>
      <p>Ajude o cachorrinho a coletar as 5 rações e chegar à saída.</p>
      <p>Cuidado com o veterinário!</p>
      <p class="hint">Mover: WASD ou setas</p>
      <button id="btn-play">Jogar</button>
    </div>

    <div id="win" class="screen hidden">
      <h1>Fase 1 concluída!</h1>
      <p id="win-text"></p>
      <button id="btn-again">Jogar novamente</button>
    </div>

    <div id="lose" class="screen hidden">
      <h1 class="bad">O veterinário pegou o cachorrinho!</h1>
      <p id="lose-text"></p>
      <button id="btn-retry">Tentar novamente</button>
    </div>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
