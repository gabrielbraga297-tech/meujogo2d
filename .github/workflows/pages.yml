name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site estático
        run: |
          mkdir _site
          cp -r index.html css js _site/
          # carimba o código curto do commit na versão mostrada no menu (js/version.js: build "dev" -> "abc1234")
          sed -i "s/build: \"dev\"/build: \"${GITHUB_SHA::7}\"/" _site/js/version.js
          grep -q "build: \"${GITHUB_SHA::7}\"" _site/js/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
